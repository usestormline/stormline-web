kind = "web"
previewPath = "/"
title = "Stormline"
description = "Event-aware protection for tokenized stocks on Robinhood Chain. A public landing experience paired with a focused shield dashboard for portfolios, storms, rules, and activity."
version = "1.0.0"
id = "artifacts/stormline"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21101

[services.development]
run = "pnpm --filter @workspace/stormline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stormline", "run", "build" ]
serve = "static"
publicDir = "artifacts/stormline/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21101"
BASE_PATH = "/"
